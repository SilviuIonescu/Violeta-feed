name: Living Frames v2

on:
  push:
    paths:
      - '.github/workflows/living-frames-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace zoom loops with element motion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('styles.css')
          css = path.read_text()
          start = css.index('/* Living Frames:')
          end = css.index('@media(prefers-reduced-motion:reduce)', start)

          replacement = r'''/* Living Frames v2 — stable camera, motion inside the scene */
.story-card:nth-child(3) .hero,.story-card:nth-child(6) .hero,.story-card:nth-child(8) .hero,.story-card:nth-child(9) .hero{overflow:hidden;isolation:isolate}
.story-card:nth-child(3) .hero::before,.story-card:nth-child(6) .hero::before,.story-card:nth-child(8) .hero::before,.story-card:nth-child(9) .hero::before{content:"LIVING FRAME  ●";position:absolute;z-index:7;top:63px;left:14px;padding:6px 9px;border-radius:99px;border:1px solid rgba(255,255,255,.22);background:rgba(7,9,13,.52);backdrop-filter:blur(12px);font-size:9px;font-weight:850;letter-spacing:1px;color:#fff;animation:livePulse 2.4s ease-in-out infinite}
.story-card:nth-child(3) .hero::after,.story-card:nth-child(6) .hero::after,.story-card:nth-child(8) .hero::after,.story-card:nth-child(9) .hero::after{content:"";position:absolute;z-index:3;inset:0;pointer-events:none}

/* Stand-up: camera and performer stay still; only stage lighting breathes */
.story-card:nth-child(3) .hero::after{background:linear-gradient(112deg,transparent 12%,rgba(255,213,159,.22) 33%,transparent 51%),linear-gradient(248deg,transparent 20%,rgba(175,145,255,.18) 43%,transparent 61%);background-size:180% 100%,180% 100%;mix-blend-mode:screen;animation:stageSweep 8s ease-in-out infinite}
.story-card:nth-child(3) .hero .hero-shade::before{content:"";position:absolute;z-index:1;left:4%;right:4%;bottom:1%;height:28%;background:radial-gradient(ellipse at 25% 90%,rgba(255,255,255,.13),transparent 24%),radial-gradient(ellipse at 70% 85%,rgba(255,255,255,.1),transparent 22%);filter:blur(7px);animation:audienceGlow 5.5s ease-in-out infinite alternate}

/* Polignano: fixed town, slow water shimmer and travelling reflections */
.story-card:nth-child(6) .hero::after{top:56%;background:repeating-linear-gradient(174deg,transparent 0 13px,rgba(210,245,255,.11) 15px 17px,transparent 19px 31px);mask-image:linear-gradient(to bottom,transparent,#000 20%,#000 80%,transparent);-webkit-mask-image:linear-gradient(to bottom,transparent,#000 20%,#000 80%,transparent);mix-blend-mode:screen;animation:waterDrift 7.5s linear infinite}
.story-card:nth-child(6) .hero .hero-shade::before{content:"";position:absolute;z-index:1;left:-35%;top:50%;width:55%;height:32%;background:radial-gradient(ellipse,rgba(255,255,255,.34),rgba(255,255,255,.08) 36%,transparent 70%);filter:blur(10px);mix-blend-mode:screen;animation:seaReflection 9s ease-in-out infinite}

/* Alberobello: static buildings, slow cloud shadow and warm light */
.story-card:nth-child(8) .hero::after{background:radial-gradient(ellipse at 18% 12%,rgba(255,255,255,.14),transparent 28%),linear-gradient(105deg,transparent 28%,rgba(255,224,174,.13) 46%,transparent 63%);background-size:150% 100%,170% 100%;mix-blend-mode:screen;animation:trulliLight 10s ease-in-out infinite}
.story-card:nth-child(8) .hero .hero-shade::before{content:"";position:absolute;z-index:1;left:-35%;top:4%;width:70%;height:28%;border-radius:50%;background:rgba(225,235,245,.14);filter:blur(22px);animation:cloudPass 13s linear infinite}

/* Food: plate remains fixed; only steam and a soft highlight move */
.story-card:nth-child(9) .hero::after{left:30%;right:30%;top:9%;bottom:38%;background:radial-gradient(ellipse at 35% 78%,rgba(255,255,255,.24),rgba(255,255,255,.07) 34%,transparent 66%),radial-gradient(ellipse at 68% 72%,rgba(255,255,255,.18),rgba(255,255,255,.05) 32%,transparent 64%);filter:blur(10px);mix-blend-mode:screen;animation:steamFloat 6.5s ease-in-out infinite}
.story-card:nth-child(9) .hero .hero-shade::before{content:"";position:absolute;z-index:1;left:-40%;top:38%;width:45%;height:20%;background:linear-gradient(100deg,transparent,rgba(255,238,205,.24),transparent);filter:blur(7px);mix-blend-mode:screen;animation:foodHighlight 9s ease-in-out infinite}

.story-card:nth-child(3) .hero .hero-shade::after,.story-card:nth-child(6) .hero .hero-shade::after,.story-card:nth-child(8) .hero .hero-shade::after,.story-card:nth-child(9) .hero .hero-shade::after{content:"";position:absolute;left:14px;right:14px;bottom:9px;height:2px;border-radius:9px;background:rgba(255,255,255,.75);transform-origin:left;animation:livingTimeline 8s linear infinite;opacity:.72}

@keyframes livePulse{0%,100%{opacity:.62}50%{opacity:1;text-shadow:0 0 9px rgba(255,255,255,.7)}}
@keyframes livingTimeline{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes stageSweep{0%,100%{background-position:115% 0,-15% 0;opacity:.48}50%{background-position:-20% 0,120% 0;opacity:.9}}
@keyframes audienceGlow{from{opacity:.28;transform:translateY(2px)}to{opacity:.62;transform:translateY(-2px)}}
@keyframes waterDrift{from{background-position:0 0}to{background-position:86px 18px}}
@keyframes seaReflection{0%{transform:translateX(-15%) scale(.8);opacity:0}30%{opacity:.72}70%{opacity:.55}100%{transform:translateX(250%) scale(1.2);opacity:0}}
@keyframes trulliLight{0%,100%{background-position:120% 0,-25% 0;opacity:.45}50%{background-position:-15% 0,110% 0;opacity:.9}}
@keyframes cloudPass{from{transform:translateX(-35%);opacity:0}18%{opacity:.5}82%{opacity:.35}to{transform:translateX(260%);opacity:0}}
@keyframes steamFloat{0%{transform:translate3d(-4%,14%,0) scale(.78);opacity:0}30%{opacity:.62}65%{opacity:.48}100%{transform:translate3d(7%,-18%,0) scale(1.18);opacity:0}}
@keyframes foodHighlight{0%,12%{transform:translateX(0);opacity:0}35%{opacity:.5}62%{opacity:.32}85%,100%{transform:translateX(330%);opacity:0}}
.modal .modal-hero{animation:none!important}
'''

          # Demo intentionally ignores the iPhone Reduce Motion preference.
          reduced_end = css.index('@media(min-width:700px)', end)
          suffix = css[reduced_end:]
          path.write_text(css[:start] + replacement + suffix)
          PY

      - name: Commit updated prototype
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git commit -m "Replace zoom loops with scene element motion [skip ci]" || exit 0
          git push
